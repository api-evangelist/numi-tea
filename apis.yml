apis:
- name: Numi Tea UCP Shopping MCP
  description: >-
    Numi Tea's Universal Commerce Protocol shopping service, exposed over MCP at
    numitea.com/api/ucp/mcp. Thirteen tools cover catalog search and lookup, product
    detail, cart create/update/cancel, checkout create/update/complete/cancel and
    order read. Capability discovery (initialize, tools/list) is anonymous; every
    tools/call requires a customer-account bearer JWT, and every tool additionally
    requires the calling agent to identify itself with a published UCP agent profile
    URI. Provisioned by Shopify for the merchant storefront and served from Numi
    Tea's own domain.
  humanURL: https://numitea.com/agents.md
  baseURL: https://numitea.com/api/ucp/mcp

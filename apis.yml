aid: numi-tea
name: Numi Tea
description: >-
  Numi Tea (Numi Organic Tea) is an Oakland, California social enterprise founded in
  1999 by siblings Ahmed Rahim and Reem Hassani, selling premium organic and Fair
  Trade certified teas and herbal teasans built from real fruits, flowers, herbs and
  spices. It is a consumer packaged-goods company with no developer program, no API
  keys and no developer portal -- but its Shopify storefront at numitea.com serves a
  genuine, live agent-commerce surface: a Universal Commerce Protocol (UCP) MCP
  server at /api/ucp/mcp exposing 13 catalog, cart, checkout and order tools with
  full JSON Schema, a UCP discovery document pinned to protocol version 2026-04-08,
  RFC 8414/9728 OAuth metadata, OpenID Connect discovery on its own account host, and
  a substantive hand-written llms.txt and agents.md instructing AI shopping agents.
  Payment completion is explicitly fenced behind contemporaneous human approval.

        description: Machine-readable sub-code. Observed value invalid_profile_url.
      - name: content
        description: Human-readable detail.
      - name: continue_url
        description: A URL the agent can hand a human to continue in a browser.
    cause: The required meta["ucp-agent"]["profile"] URI was absent or could not be fetched.
    remediation: Publish a UCP agent profile and pass its URI in meta["ucp-agent"]["profile"] on every call.
    retryable: false
    observed: '2026-08-26'

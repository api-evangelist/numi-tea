problem_types:
  - code: -32000
    message: AuthenticationRequired
    class: server-defined
    data_type: string
    data_example: >-
      Unauthorized: A valid JWT is required to call no_such_tool. See
      https://shopify.dev/docs/agents/get-started/authentication for instructions on
      generating a token and authenticating your requests.
    cause: A tools/call was made without a bearer JWT.
    remediation: Obtain a token via the Shopify agent authentication flow and send it in the Authorization header.
    remediation_docs: https://shopify.dev/docs/agents/get-started/authentication
    retryable: false
    observed: '2026-08-26'
    note: >-
      Notably this error fires even for a tool name that does not exist, so
      authentication is checked before tool resolution. An unauthenticated client
      cannot distinguish a bad tool name from a missing credential.
  - code: -32001
    message: UCP discovery failed
    class: server-defined
    data_type: object
    data_example: '{"code":"invalid_profile_url","content":"Unable to fetch agent profile: Missing profile uri","continue_url":"https://2f9c86.myshopify.com/"}'
    data_fields:
